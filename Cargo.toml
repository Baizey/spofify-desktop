[package]
name = "spofify-desktop"
version = "1.0.1"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "unstable-winit-030", "renderer-software", "accessibility", "compat-1-18"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
hyper = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
cookie = "0.18"
rodio = "=0.21.1"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ring = "0.17"
rustix = { version = "1.1", features = ["fs", "process"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

[build-dependencies]
slint-build = "=1.18.1"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
