name: Desktop release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Build only, or publish a release with this version change
        type: choice
        required: true
        default: build-only
        options:
          - build-only
          - initial
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: spofify-desktop-release-${{ inputs.release != 'build-only' && github.ref == 'refs/heads/main' && 'publish' || format('check-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      SPOFIFY_UPDATE_REPO: ${{ github.repository }}
      SPOFIFY_UPDATE_PUBLIC_KEY: ${{ vars.SPOFIFY_UPDATE_PUBLIC_KEY }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve the release version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [[ "$RELEASE" == build-only ]]; then
            version=$(python3 scripts/release_version.py)
          else
            test "$GITHUB_REF" = refs/heads/main || { echo 'Publish only from main.' >&2; exit 1; }
            version=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | python3 scripts/release_version.py "$RELEASE")
            test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PUBLIC \
              || { echo 'The update channel must be publicly readable.' >&2; exit 1; }
            [[ "$SPOFIFY_UPDATE_PUBLIC_KEY" =~ ^[a-f0-9]{64}$ ]] \
              || { echo 'Configure the SPOFIFY_UPDATE_PUBLIC_KEY repository variable.' >&2; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Linux build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libfontconfig1-dev desktop-file-utils
          rustup update stable --no-self-update
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ubuntu-24.04-release
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test and build the release application
        run: |
          cargo +stable test --locked
          dbus-run-session -- cargo +stable test --locked mpris::tests::desktop_controller_round_trip -- --ignored
          cargo +stable build --locked --release
      - name: Package and smoke-test the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          package="spofify-desktop-$VERSION"
          mkdir -p dist "$scratch/stage/$package" "$scratch/unpacked" "$scratch/home"
          install -m755 target/release/spofify-desktop dist/spofify-desktop-linux-x86_64
          install -m755 dist/spofify-desktop-linux-x86_64 "$scratch/stage/$package/spofify-desktop"
          install -m755 packaging/install-release.sh "$scratch/stage/$package/install.sh"
          install -m644 packaging/spofify-desktop.desktop assets/JetBrainsMono-OFL.txt "$scratch/stage/$package/"
          install -m644 assets/spofify-logo.svg "$scratch/stage/$package/spofify-desktop.svg"
          archive="dist/$package-linux-x86_64.tar.gz"
          tar -czf "$archive" -C "$scratch/stage" "$package"
          tar -xzf "$archive" -C "$scratch/unpacked"
          env -u XDG_DATA_HOME HOME="$scratch/home" "$scratch/unpacked/$package/install.sh"
          desktop-file-validate "$scratch/home/.local/share/applications/spofify-desktop.desktop"
          installed="$scratch/home/.local/lib/spofify-desktop/spofify-desktop"
          cmp dist/spofify-desktop-linux-x86_64 "$installed"
          test "$("$installed" --version)" = "Spofify Desktop $VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: spofify-desktop-linux-x86_64
          path: |
            dist/spofify-desktop-linux-x86_64
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: ${{ inputs.release != 'build-only' && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
      RELEASE: ${{ inputs.release }}
      SPOFIFY_UPDATE_REPO: ${{ github.repository }}
      SPOFIFY_UPDATE_PUBLIC_KEY: ${{ vars.SPOFIFY_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: spofify-desktop-linux-x86_64
          path: dist
      - name: Sign the update manifest
        env:
          SPOFIFY_RELEASE_SIGNING_KEY: ${{ secrets.SPOFIFY_RELEASE_SIGNING_KEY }}
        run: python3 scripts/sign-release.py dist "$VERSION"
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          resolved=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 scripts/release_version.py "$RELEASE")
          test "$resolved" = "$VERSION" || { echo 'Package version changed before publishing.' >&2; exit 1; }
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PUBLIC \
            || { echo 'The update channel must be publicly readable.' >&2; exit 1; }
          tag="v$VERSION"
          # Create-only: a concurrent/existing tag must not be reused.
          target=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --jq .object.sha)
          test "$target" = "$GITHUB_SHA" || { echo 'Release tag does not match the packaged commit.' >&2; exit 1; }
          gh release create "$tag" "dist/spofify-desktop-$VERSION-linux-x86_64.tar.gz" \
            dist/spofify-desktop-linux-x86_64 dist/update-v1-linux-x86_64.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest --generate-notes \
            --title "Spofify Desktop $VERSION"
