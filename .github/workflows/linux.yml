name: Native Linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libfontconfig1-dev desktop-file-utils
          rustup update stable --no-self-update
          rustup component add --toolchain stable rustfmt
      - name: Test the local desktop deployment pipeline
        run: bash scripts/test-local-deploy.sh
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Test the locked application
        run: cargo +stable test --locked
      - name: Exercise OS media keys on a private bus
        run: dbus-run-session -- cargo +stable test --locked mpris::tests::desktop_controller_round_trip -- --ignored
      - name: Build and stage the Linux application
        run: |
          cargo +stable build --locked
          dest="$RUNNER_TEMP/spofify-package"
          make install BINARY=target/debug/spofify-desktop PREFIX=/usr DESTDIR="$dest"
          desktop-file-validate "$dest/usr/share/applications/spofify-desktop.desktop"
          test -x "$dest/usr/bin/spofify-desktop"
          make uninstall PREFIX=/usr DESTDIR="$dest"
          test -z "$(find "$dest" -type f -print -quit)"
